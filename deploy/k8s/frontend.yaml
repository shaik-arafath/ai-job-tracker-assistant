apiVersion: apps/v1
kind: Deployment
metadata:
  name: aijobtracker-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aijobtracker-frontend
  template:
    metadata:
      labels:
        app: aijobtracker-frontend
    spec:
      containers:
        - name: frontend
          image: your-registry/ai-job-tracker-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: aijobtracker-frontend
spec:
  selector:
    app: aijobtracker-frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aijobtracker-ingress
spec:
  rules:
    - host: aijobtracker.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aijobtracker-frontend
                port:
                  number: 80
