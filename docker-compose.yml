services:
  mysql:
    image: mysql:8.4
    container_name: aijobtracker-mysql
    environment:
      MYSQL_DATABASE: aijobtracker
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: aijobtracker-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/aijobtracker
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      JWT_SECRET: "12345678901234567890123456789012"
    depends_on:
      - mysql
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: aijobtracker-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
